name: Generate Stats

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Readme Stats SVG
        run: |
          mkdir -p dist
          curl -s "https://github-readme-stats.vercel.app/api?username=Nico-RF&show_icons=true&theme=tokyonight" -o dist/stats.svg
          curl -s "https://github-readme-stats.vercel.app/api/top-langs/?username=Nico-RF&layout=compact&theme=tokyonight" -o dist/languages.svg

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
