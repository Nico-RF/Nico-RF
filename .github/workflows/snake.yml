name: Generate Snake

on:
  schedule:
    # Runs automatically every 12 hours
    - cron: "0 */12 * * *"
  # Allows you to manually trigger it anytime from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step A: Generate the snake SVGs using Platane's action
      - uses: Platane/snk@v3
        with:
          github_user_name: Nico-RF
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Step B: Push the generated SVGs to an 'output' branch
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
