name: Generate Profile Metrics

on:
  schedule:
    # Runs automatically every 12 hours
    - cron: "0 */12 * * *"
  # Allows manual runs from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Base Metrics & Languages
        uses: lowlighter/metrics@latest
        with:
          # Uses GitHub's built-in short-lived token — NO PAT NEEDED!
          token: ${{ secrets.GITHUB_TOKEN }}
          
          # Options
          user: Nico-RF
          template: classic
          base: header, activity, community, repositories, metadata
          filename: github-metrics.svg
          config_theme: tokyonight
          
          # 1. Top Languages Plugin (replaces top-langs card)
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_details: percentage

          # 2. Streak & Habits Plugin (replaces streak-stats card)
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
