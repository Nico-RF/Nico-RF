name: Generate Profile Trophies

on:
  schedule:
    # Runs automatically every 12 hours
    - cron: "0 */12 * * *"
  # Allows manual triggers from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-trophies:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Trophies SVG
        uses: lowlighter/metrics@latest
        with:
          # Uses built-in temporary token - NO PAT required
          token: ${{ secrets.METRICS_TOKEN }}
          
          # General Settings
          user: Nico-RF
          filename: github-trophies.svg
          base: "" # Disables standard stats/header to isolate trophies
          config_theme: tokyonight

          # Achievements / Trophies Plugin
          plugin_achievements: yes
          plugin_achievements_threshold: X     # Displays all earned rank tiers
          plugin_achievements_secrets: yes       # Includes secret achievements
          plugin_achievements_limit: 8           # Maximum number of achievements to display
          plugin_achievements_display: compact  # Use 'compact' or 'detailed'
