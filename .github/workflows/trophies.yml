name: Generate Profile Trophies

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-trophies:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Trophies SVG
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          
          user: Nico-RF
          filename: github-trophies.svg
          base: "" # Keeps stats off, isolates trophies only
          config_theme: tokyonight

          # Achievements Configuration
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: X
          
          # CRITICAL FIX: Explicit list of safe achievements.
          # This disables the deprecated Projects (classic) API calls.
          plugin_achievements_only: polyglot, stargazer, deployer, member, maintainer, developer, scripter, packager, explorer, infographile
